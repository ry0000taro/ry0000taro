<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect width="900" height="260" rx="14"/></clipPath>

    <pattern id="plaidColors" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0"  y="0"  width="50" height="50" fill="#4b4f58"/>
      <rect x="50" y="0"  width="50" height="50" fill="#7a2e3a"/>
      <rect x="0"  y="50" width="50" height="50" fill="#7a2e3a"/>
      <rect x="50" y="50" width="50" height="50" fill="#c6b08a"/>
    </pattern>
    <pattern id="plaidAccent" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="200" height="200" fill="none"/>
      <rect x="100" y="100" width="100" height="100" fill="#7e93a8" fill-opacity="0.85"/>
    </pattern>
    <pattern id="quiltGrid" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="50" height="50" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.4"/>
    </pattern>

    <pattern id="satin" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="5" height="5" fill="#ffffff"/>
      <rect y="2.3" width="5" height="1" fill="#d7dadc"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <style>
      text { font-family: 'Arial Rounded MT Bold', 'Varela Round', Verdana, Arial, sans-serif; font-weight: 900; }
      .shadow {
        fill: #141414;
        opacity: 0;
        animation: fadein 10.0s linear infinite;
      }
      .stitchtext {
        fill: url(#satin);
        stroke: #2b2b2b;
        stroke-width: 1.1;
        stroke-dasharray: 2.6 2.6;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill-opacity: 0;
        opacity: 0;
        stroke-dashoffset: 170;
        filter: url(#soft);
        animation: stitch 10.0s linear infinite;
      }
      @keyframes stitch {
        0%   { opacity: 0; stroke-dashoffset: 170; fill-opacity: 0; }
        2%   { opacity: 1; stroke-dashoffset: 170; fill-opacity: 0; }
        12%  { opacity: 1; stroke-dashoffset: 0;   fill-opacity: 0; }
        19%  { opacity: 1; stroke-dashoffset: 0;   fill-opacity: 1; }
        88%  { opacity: 1; stroke-dashoffset: 0;   fill-opacity: 1; }
        96%  { opacity: 0; stroke-dashoffset: 0;   fill-opacity: 1; }
        100% { opacity: 0; stroke-dashoffset: 170; fill-opacity: 0; }
      }
      @keyframes fadein {
        0%   { opacity: 0; }
        2%   { opacity: 0; }
        19%  { opacity: 0.4; }
        88%  { opacity: 0.4; }
        96%  { opacity: 0; }
        100% { opacity: 0; }
      }
      .needle {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: top center;
        animation: needle-bob 10.0s linear infinite;
      }
      @keyframes needle-bob {
        0%   { opacity: 0; transform: translateY(-6px); }
        2%   { opacity: 1; transform: translateY(-6px); }
        8%   { opacity: 1; transform: translateY(14px); }
        12%  { opacity: 1; transform: translateY(-6px); }
        15%  { opacity: 0; transform: translateY(-6px); }
        100% { opacity: 0; transform: translateY(-6px); }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#plaidColors)"/>
    <rect width="900" height="260" fill="url(#plaidAccent)"/>
    <rect width="900" height="260" fill="url(#quiltGrid)"/>
    <rect width="900" height="260" fill="#000000" fill-opacity="0.08"/>

    <g>
